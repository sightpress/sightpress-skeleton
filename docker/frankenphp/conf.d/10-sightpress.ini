; Production PHP settings for SightPress (on top of php.ini-production).
expose_php = Off
memory_limit = 256M
max_execution_time = 30

; Media uploads. The media library also limits size, pixels and pages itself.
upload_max_filesize = 64M
post_max_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Code only changes with a new image.
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = sightpress

session.use_strict_mode = 1
zend.exception_ignore_args = 1
